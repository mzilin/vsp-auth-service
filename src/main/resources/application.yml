# Server properties
server:
  port: 8100

# Information for the info endpoint
info:
  app:
    environment: DEV
    name: ${spring.application.name}
    description: Identity Service - Local Instance

# Spring application properties
spring:
  application:
    name: auth-identity
  profiles:
    active: dev
  config:
    import:
      - optional:configserver:discovery://config-server
      - optional:file:./env.properties
  datasource:
    url: ${DB_URL}
    driverClassName: ${DB_DRIVER_CLASS}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: ${DB_DIALECT}
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RMQ_HOST}
    port: ${RMQ_PORT}
    username: ${RMQ_USERNAME}
    password: ${RMQ_PASSWORD}

# Eureka configuration
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_DEFAULT_ZONE}
  instance:
    preferIpAddress: true

# RabbitMQ settings
rabbitmq:
  exchange: ${RMQ_EXCHANGE}
  queues:
    create-credentials: ${RMQ_CREATE_CREDENTIALS_Q}
    reset-passcode: ${RMQ_RESET_PASSCODE_Q}
    delete-user-data: ${RMQ_DELETE_USER_DATA_Q}
  routing-keys:
    platform-emails: ${RMQ_PLATFORM_EMAILS_RK}
    verify-account: ${RMQ_VERIFY_ACCOUNT_RK}
    create-credentials: ${RMQ_CREATE_CREDENTIALS_RK}
    reset-passcode: ${RMQ_RESET_PASSCODE_RK}
    delete-user-data: ${RMQ_DELETE_USER_DATA_RK}

# Management properties
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info, health, refresh

app:
  accessTokenSecret: ${ACCESS_TOKEN_SECRET}
  refreshTokenSecret: ${REFRESH_TOKEN_SECRET}

# Logging properties
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.mariuszilinskas.streamix: DEBUG
